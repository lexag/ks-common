[package]
name = "protocol"
edition = "2024"

[dependencies]
beat = { path = "../beat" }
event = { path = "../event" }
cue = { path = "../cue" }
mem = { path = "../mem" }
local = { path = "../local" }
bitflags = { version = "2.10.0" }
serde = { version = "1.0.228", optional = true }
